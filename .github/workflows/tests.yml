name: Python tests

on:
  push:
    branches: [improve/reliability-performance-ux, refactor/project-structure, feat/gui-redesign]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.21.0
      - name: Compile Python modules
        run: python -m compileall -q src tests main.py gui_main.py
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build GUI distribution
        run: python -m PyInstaller --noconfirm --clean "packaging/Music Cover Art Manage.spec"
      - name: Build CLI distribution
        run: python -m PyInstaller --noconfirm --clean "packaging/Music Cover Art Manage CLI.spec"
